<style>
  :root {
    --bg: #f6f5f3;
    --panel: #ffffff;
    --border: #dcd8d1;
    --text: #23211d;
    --muted: #6b6660;
    --accent: #1f5e4e;
    --accent-soft: #e6f0ec;
    --error: #a3372a;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a;
      --panel: #202225;
      --border: #35373a;
      --text: #eceae6;
      --muted: #9a968f;
      --accent: #4fae8f;
      --accent-soft: #1c2e28;
      --error: #e0685a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --panel: #202225;
    --border: #35373a;
    --text: #eceae6;
    --muted: #9a968f;
    --accent: #4fae8f;
    --accent-soft: #1c2e28;
    --error: #e0685a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  p.lead {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 22px;
  }
  legend {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 10px;
    padding: 0;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .option:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .option input {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
  }
  .option label {
    cursor: pointer;
    font-size: 0.95rem;
  }
  label.field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
  }
  input[type="text"]:focus, .option input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 6px;
    min-height: 1.2em;
  }
  .hint.error { color: var(--error); }

  .result {
    margin-top: 22px;
  }
  .result-box {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--bg);
  }
  .result-box a {
    flex: 1;
    font-family: var(--mono);
    font-size: 0.85rem;
    word-break: break-all;
    color: var(--accent);
    text-decoration: none;
  }
  .result-box a:hover {
    text-decoration: underline;
  }
  button.copy {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.copy:hover { border-color: var(--accent); }
  button.copy.copied { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Product URL generator</h1>
  <p class="lead">Pick an environment and enter a Product ID to build the self-register link.</p>

  <div class="card">
    <fieldset>
      <legend>Environment</legend>
      <div class="option">
        <input type="radio" name="env" id="env-dev" value="https://qahe--qahedev.sandbox.my.site.com/s/login/SelfRegister?startURL=%2Fs%2Fproduct%2F">
        <label for="env-dev">QAHEDEV</label>
      </div>
      <div class="option">
        <input type="radio" name="env" id="env-uat" value="https://qahe--qaheuat.sandbox.my.site.com/s/login/SelfRegister?startURL=%2Fs%2Fproduct%2F">
        <label for="env-uat">QAHEUAT</label>
      </div>
      <div class="option">
        <input type="radio" name="env" id="env-prod" value="https://apply.qahighereducation.com/s/login/SelfRegister?startURL=%2Fs%2Fproduct%2F">
        <label for="env-prod">PROD</label>
      </div>
    </fieldset>

    <div>
      <label class="field-label" for="product-id">Salesforce Product ID</label>
      <input type="text" id="product-id" placeholder="01tXXXXXXXXXXXXXXX" autocomplete="off" spellcheck="false">
      <div class="hint" id="id-hint">15 or 18 characters, starting with 01t.</div>
    </div>

    <div class="result" id="result" style="display:none;">
      <div class="result-box">
        <a id="url-text" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button class="copy" id="copy-btn" type="button">Copy</button>
      </div>
      <div class="hint">Tip: right-click the link and choose "Open link in incognito window" (or "in private window") if you'd like it to open that way.</div>
    </div>
  </div>
</main>

<script>
  const envInputs = document.querySelectorAll('input[name="env"]');
  const idInput = document.getElementById('product-id');
  const idHint = document.getElementById('id-hint');
  const resultBox = document.getElementById('result');
  const urlText = document.getElementById('url-text');
  const copyBtn = document.getElementById('copy-btn');

  const ID_PATTERN = /^01t([a-zA-Z0-9]{12}|[a-zA-Z0-9]{15})$/;

  function getSelectedHead() {
    const checked = document.querySelector('input[name="env"]:checked');
    return checked ? checked.value : null;
  }

  function update() {
    const head = getSelectedHead();
    const id = idInput.value.trim();
    const valid = ID_PATTERN.test(id);

    if (id.length === 0) {
      idHint.textContent = '15 or 18 characters, starting with 01t.';
      idHint.classList.remove('error');
    } else if (!valid) {
      idHint.textContent = 'Doesn\'t look like a valid Product ID (expects 01t + 12 or 15 more characters).';
      idHint.classList.add('error');
    } else {
      idHint.textContent = 'Looks good.';
      idHint.classList.remove('error');
    }

    if (head && valid) {
      const fullUrl = head + id;
      urlText.textContent = fullUrl;
      urlText.href = fullUrl;
      resultBox.style.display = 'block';
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    } else {
      resultBox.style.display = 'none';
    }
  }

  envInputs.forEach(input => input.addEventListener('change', update));
  idInput.addEventListener('input', update);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(urlText.textContent);
      copyBtn.textContent = 'Copied';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1500);
    } catch (e) {
      // Fallback: select the text for manual copy
      const range = document.createRange();
      range.selectNodeContents(urlText);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  update();

  // Resize the window to fit the content. This only takes effect when the
  // page is running as an installed web app (standalone/PWA window), which
  // owns its window and is allowed to resize/move it. In a normal browser
  // tab this is blocked by the browser (a tab doesn't own its window), so
  // we skip it there rather than attempt something that won't work.
  window.addEventListener('load', () => {
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: window-controls-overlay)').matches ||
      window.navigator.standalone === true; // iOS Safari home-screen apps

    if (!isStandalone) return;

    try {
      const targetWidth = Math.min(640, screen.availWidth);
      const targetHeight = Math.min(720, screen.availHeight);
      window.resizeTo(targetWidth, targetHeight);
    } catch (e) {
      // Ignore - resizing not permitted in this context.
    }
  });
</script>
</body>
</html>
